name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/sink-go-gofmt.out
          test ! -s /tmp/sink-go-gofmt.out

      - name: Run race tests
        run: make test-coverage

      - name: Preserve unit coverage and test events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-coverage
          path: .reports/coverage/
          include-hidden-files: true
          retention-days: 14

      - name: Fuzz canonical URI boundaries
        run: |
          mkdir -p .reports/fuzz
          protocol_dir="$(go list -m -f '{{.Dir}}' github.com/batchstream/sink-protocol)"
          fuzz_dir="$(mktemp -d)"
          cp -R "${protocol_dir}/uri/." "${fuzz_dir}/"
          (cd "${fuzz_dir}" && GO111MODULE=off go test -run='^$' -fuzz='^FuzzCanonicalURI$' -fuzztime=30s -parallel=2 .) 2>&1 | tee .reports/fuzz/uri.log
          grep -q 'new interesting:' .reports/fuzz/uri.log

      - name: Preserve fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uri-fuzzing
          path: |
            .reports/fuzz/
          include-hidden-files: true
          retention-days: 14

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=all ./...

  compatibility:
    name: Current Sink integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Sink server ref
        id: server-ref
        env:
          CANDIDATE_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [[ -n "${CANDIDATE_REF}" ]] && git ls-remote --exit-code --heads https://github.com/batchstream/sink.git "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
            ref="${CANDIDATE_REF}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out Sink server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: batchstream/sink
          path: sink-server
          ref: ${{ steps.server-ref.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Sink with MongoDB and Kafka
        run: docker compose --file sink-server/examples/quickstart/compose.yaml up --detach --build engine worker gateway

      - name: Wait for storage and Kafka readiness
        run: |
          deadline=$((SECONDS + 90))
          until curl --max-time 2 --fail --silent --output /dev/null http://127.0.0.1:18081/readyz; do
            if (( SECONDS >= deadline )); then
              echo "Sink dependencies did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Run current protocol integration tests
        env:
          SINK_INTEGRATION_ADDRESS: 127.0.0.1:8080
        run: go test -tags=integration ./... -count=1

      - name: Print service logs after failure
        if: failure()
        run: docker compose --file sink-server/examples/quickstart/compose.yaml logs --no-color || true

      - name: Stop services
        if: always()
        run: docker compose --file sink-server/examples/quickstart/compose.yaml down --volumes --remove-orphans
