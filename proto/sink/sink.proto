syntax = "proto3";

package sink.v1;

option go_package = "github.com/liran/sink-go/api/sink/v1;sinkv1";

// Sink provides database-independent record reads and mutations.
//
// Record requests are batch-native. Atomicity is guaranteed per record, never
// for the whole request. Native queries use Execute, Query, Count or paged Scan.
service Sink {
  rpc Read(ReadRequest) returns (stream ReadResponse);
  rpc Write(WriteRequest) returns (stream WriteResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Query(QueryRequest) returns (stream QueryResponse);
  rpc Count(CountRequest) returns (CountResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
}

// RecordAddress is a canonical sink://<store>/<path> URI. The core treats the
// path as opaque; each Store adapter owns its path grammar. The full canonical
// URI is the record identity for routing, batching, and durable delivery.
message RecordAddress {
  string uri = 1;
}

// Document contains one explicitly encoded user object. Callers select JSON
// for search storage and BSON for MongoDB storage.
message Document {
  DocumentEncoding encoding = 1;
  bytes payload = 2;
}

enum DocumentEncoding {
  DOCUMENT_ENCODING_UNSPECIFIED = 0;
  DOCUMENT_ENCODING_JSON = 1;
  DOCUMENT_ENCODING_BSON = 2;
}

// RevisionToken is interpreted only by the selected storage adapter.
message RevisionToken {
  bytes data = 1;
}

// CompletionMode defines the point at which a mutating RPC returns success.
enum CompletionMode {
  COMPLETION_MODE_UNSPECIFIED = 0;

  // Wait until the storage adapter has applied each operation.
  COMPLETION_MODE_WAIT_UNTIL_APPLIED = 1;

  // Return after a durable asynchronous queue has accepted each operation.
  // Acceptance does not mean that the storage adapter has applied it.
  COMPLETION_MODE_RETURN_AFTER_ACCEPTED = 2;

  // Wait until the storage adapter has applied each operation and made the
  // result visible to subsequent reads. Search adapters use refresh=wait_for.
  COMPLETION_MODE_WAIT_UNTIL_VISIBLE = 3;
}

message ReadRequest {
  repeated ReadOperation operations = 1;
}

message ReadOperation {
  RecordAddress address = 1;
}

message ReadResponse {
  // Each frame contains one result. Results may arrive out of order; correlate
  // by operation_index. Successful EOF requires exactly one result per operation.
  repeated ReadResult results = 1;
}

message ReadResult {
  uint32 operation_index = 1;
  ReadStatus status = 2;
  Document document = 3;
  RevisionToken revision = 4;
  Failure failure = 5;
}

enum ReadStatus {
  READ_STATUS_UNSPECIFIED = 0;
  READ_STATUS_FOUND = 1;
  READ_STATUS_NOT_FOUND = 2;
  READ_STATUS_FAILED = 3;
}

message WriteRequest {
  CompletionMode completion_mode = 1;

  // Operations for the same address are executed in request order. Operations
  // for different addresses may execute concurrently.
  repeated WriteOperation operations = 2;

  // Programs can be declared once and referenced by digest from multiple merge
  // operations, avoiding repeated Lua source bytes in a synchronous batch.
  repeated LuaProgram lua_programs = 3;
}

message WriteOperation {
  RecordAddress address = 1;

  // Return the logical document submitted by this operation after its commit.
  // Only synchronous completion modes support this. These operations do not
  // share a folded commit with preceding or following operations.
  bool return_document = 4;

  oneof action {
    PutOperation put = 2;
    MergeOperation merge = 3;
  }
}

// PutOperation writes a complete user document without interpreting its fields.
message PutOperation {
  Document document = 1;
  WriteMode mode = 2;
}

enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_MODE_CREATE = 1;
  WRITE_MODE_REPLACE = 2;
  WRITE_MODE_UPSERT = 3;
}

// MergeOperation carries the original merge intent. In asynchronous mode Sink
// expands any program reference before queueing the operation so the worker can
// merge against the document version it reads at execution time.
message MergeOperation {
  Document incoming_document = 1;
  LuaProgram lua_program = 2;
}

// LuaProgram is self-contained so merge rules can be versioned and deployed
// with the calling application instead of being registered in Sink.
message LuaProgram {
  // Source may be omitted from a merge operation when the matching full program
  // is present in WriteRequest.lua_programs. Workers always receive full source.
  bytes source = 1;

  // Optional SHA-256 digest. Sink verifies it when present and always uses the
  // computed digest as the compiled-program cache key.
  bytes sha256 = 2;
}

// Each frame contains one final result, identified by operation_index.
// A disconnected stream does not establish the outcome of missing operations.
message WriteResponse {
  repeated WriteResult results = 1;
}

message WriteResult {
  uint32 operation_index = 1;
  WriteStatus status = 2;
  RevisionToken revision = 3;
  Failure failure = 4;
  Document document = 5;
}

enum WriteStatus {
  WRITE_STATUS_UNSPECIFIED = 0;

  // The asynchronous queue accepted the operation durably.
  WRITE_STATUS_ACCEPTED = 1;

  // The storage adapter applied the operation.
  WRITE_STATUS_APPLIED = 2;

  // A CREATE, REPLACE, or adapter-level revision condition did not match.
  WRITE_STATUS_PRECONDITION_FAILED = 3;
  WRITE_STATUS_FAILED = 4;
}

message DeleteRequest {
  CompletionMode completion_mode = 1;

  // Deletes are hard deletes. Deleting an absent record is successful.
  repeated DeleteOperation operations = 2;
}

message DeleteOperation {
  RecordAddress address = 1;
}

message DeleteResponse {
  repeated DeleteResult results = 1;
}

message DeleteResult {
  uint32 operation_index = 1;
  DeleteStatus status = 2;
  Failure failure = 3;
}

enum DeleteStatus {
  DELETE_STATUS_UNSPECIFIED = 0;
  DELETE_STATUS_ACCEPTED = 1;
  DELETE_STATUS_APPLIED = 2;
  DELETE_STATUS_FAILED = 3;
}

message Failure {
  FailureCode code = 1;
  string message = 2;
  bool retryable = 3;
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_INVALID_ARGUMENT = 1;
  FAILURE_CODE_PRECONDITION_FAILED = 2;
  FAILURE_CODE_NOT_FOUND = 3;
  FAILURE_CODE_CONFLICT = 4;
  FAILURE_CODE_RESOURCE_EXHAUSTED = 5;
  FAILURE_CODE_UNAVAILABLE = 6;
  FAILURE_CODE_DEADLINE_EXCEEDED = 7;
  FAILURE_CODE_INTERNAL = 8;
}

// Command is shared by Execute, Query, Count and Scan. The canonical URI selects
// a configured Store; only its adapter interprets the remaining path.
// MongoDB uses sink://store/database[/collection] with an ordered BSON payload.
// HTTP search uses sink://store/index with a separate native operation path,
// such as /_search, method, query, headers and body. A Store root is
// spelled sink://store. Endpoints and authentication come from configuration.
message Command {
  string uri = 1;

  // Native request method, such as GET or POST. Unused by MongoDB.
  string method = 2;

  // Operation path relative to the URI resource, e.g. /_search or /_mapping.
  // Unused by MongoDB; its operation is carried by the BSON command.
  string path = 3;

  // URL-encoded query parameters without a leading '?'; repeated keys are valid.
  string query = 4;

  // Authentication and transport-owned headers remain server-controlled.
  // Set Content-Type using content_type, not headers.
  repeated Header headers = 5;

  // Payload media type. Required when payload is nonempty.
  string content_type = 6;

  // Original ordered command or request body, without a Sink-specific envelope.
  bytes payload = 7;
}

message Header {
  string name = 1;
  repeated string values = 2;
}

// Execute performs one native interaction. It does not provide cross-RPC
// session affinity. Adapters reject commands requiring session affinity or a
// client-managed session; supported cursor queries use Scan instead.
// Each adapter validates its supported operations before forwarding. MongoDB
// protects revisions on supported writes; HTTP search rejects index lifecycle
// and alias management, including unknown administrative write endpoints.
//
// Permitted writes retain backend semantics subject to adapter safeguards. They
// do not run Lua merges, record batching or asynchronous completion. Neither
// Sink nor its SDK should automatically replay Execute after an unknown outcome.
message ExecuteRequest {
  Command command = 1;
}

// A complete native reply retains its original payload, including backend error
// replies. Such replies use gRPC OK with success=false; validation, transport
// and capacity failures use gRPC errors. HTTP replies preserve the status,
// repeated headers and entity bytes; redirects are returned without following.
message ExecuteResponse {
  string content_type = 1;
  bytes payload = 2;

  // Native command success, or HTTP 2xx. Callers must still inspect item-level
  // failures in batch responses. Document commands also check native write and
  // write-concern errors.
  bool success = 3;

  // Native transport status when available; zero means no such status exists.
  uint32 status_code = 4;
  repeated Header headers = 5;
}

// Query returns an independent page without retaining a cursor between RPCs.
// Supported sources are find/read-only aggregate command documents and HTTP
// _search requests. Documents have the same native result shape as Scan.
// Use a stable native sort with a unique tie-breaker for predictable pages.
// Concurrent changes may shift results; pagination does not provide a snapshot.
message QueryRequest {
  Command command = 1;

  // One-based page number; zero selects page 1. Deep pages still incur backend
  // offset costs and are subject to the backend's result-window limits.
  uint32 page = 2;

  // Zero selects 100; maximum 1000. Query replaces native find skip/limit and
  // HTTP from/size. For aggregate, pagination follows the supplied pipeline.
  uint32 page_size = 3;

  // Ordered sort keys. Empty preserves the native sort; nonempty replaces find
  // or HTTP sorting. For aggregate, sort follows the supplied pipeline.
  repeated SortField sort = 4;

  // Absent preserves native projection. Present replaces find projection or
  // HTTP _source selection; aggregate applies it after the pipeline and sort,
  // before pagination. An empty fields list selects all document fields.
  Projection projection = 5;
}

message SortField {
  string field = 1;
  bool descending = 2;
}

// Field names are native document paths (relative to _source for HTTP search).
// HTTP hit metadata is unchanged. Document stores retain their native rules for
// identity-field projection.
// Database-specific computed projections can remain in Command.payload.
message Projection {
  repeated string fields = 1;
  bool exclude = 2; // False includes listed fields; true excludes them.
}

// Document frames contain one document. A final, document-free frame sets
// complete and has_more. Metadata is valid only after successful EOF.
message QueryResponse {
  bool complete = 3;
  repeated Document documents = 1;

  // Determined by fetching one extra result, not by running Count. Result-window
  // limits apply to this extra result too. A byte limit fails the whole request;
  // it never produces a silently shortened page.
  bool has_more = 2;
}

// Count is an independent query, not an implicit part of Query. It accepts the
// same sources and counts matches before find/HTTP pagination; for aggregate it
// counts the output of the supplied pipeline. HTTP counts matching documents
// before collapse. Partial or timed-out counts fail the request.
// Count and Query are separate observations and may differ under concurrent writes.
message CountRequest {
  // MongoDB find with an absent or empty filter automatically uses collection
  // metadata when no options require exact execution. Filtered queries,
  // aggregate pipelines and HTTP search counts remain exact.
  Command command = 1;
}

message CountResponse {
  uint64 count = 1;
  // True when the backend used an estimate instead of counting matching rows.
  bool estimated = 2;
}

// Scan returns one live page. Supply the same Command and Projection and pass
// next_cursor back as cursor after processing a page. Cursors carry the seek
// position across server restarts and do not expire; no database session
// survives a request. Task deadlines and checkpoint retention belong to callers.
// Concurrent changes can affect later pages and retries. Scan is not a snapshot.
message ScanRequest {
  Command command = 1;

  // Zero selects 100; maximum 1000. The byte limit may produce a smaller page.
  uint32 batch_size = 2;

  // Empty starts a new scan. Treat this continuation marker as opaque; it is
  // bound to Command and Projection and is not an authorization credential.
  bytes cursor = 3;

  // Absent preserves native projection. Present replaces find projection or
  // HTTP _source selection. Empty fields selects all document fields. MongoDB
  // retains _id internally for continuation even when excluded from results;
  // HTTP hit metadata and sort values are unchanged.
  Projection projection = 4;
}

// Documents retain native encodings: BSON documents or complete JSON hits.
// A failed stream may have delivered documents but never a committed page.
// Resume from the last saved cursor with idempotent business processing.
// Document frames contain one document. A final, document-free frame sets
// complete and next_cursor. Checkpoint only after successful EOF.
message ScanResponse {
  bool complete = 3;
  repeated Document documents = 1;

  // Empty means the scan reached the end observed by this request. Commit a
  // checkpoint only after processing documents and successful EOF. No close RPC is needed.
  bytes next_cursor = 2;
}
